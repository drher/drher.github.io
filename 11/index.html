<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>火柴人小遊戲</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: #101522;
      color: #f2f4fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #273653 0, transparent 58%),
        #101522;
    }

    main {
      width: min(900px, 100%);
    }

    header {
      margin-bottom: 18px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      letter-spacing: 0.08em;
    }

    header p {
      margin: 0;
      color: #aab5c9;
    }

    .game-frame {
      overflow: hidden;
      border: 1px solid #35415a;
      border-radius: 18px;
      background: #182236;
      box-shadow: 0 24px 70px #0006;
    }

    canvas {
      display: block;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
      height: auto;
      background: #b9e5f2;
    }

    canvas:focus-visible {
      outline: 3px solid #fff;
      outline-offset: -5px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 24px;
      padding: 18px;
      color: #d5dced;
      font-size: 0.95rem;
    }

    .control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    kbd {
      min-width: 34px;
      padding: 5px 9px;
      border: 1px solid #596780;
      border-bottom-width: 3px;
      border-radius: 7px;
      background: #26334a;
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-align: center;
    }

    .hint {
      margin: 14px 0 0;
      color: #8491a8;
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .controls {
        gap: 12px 16px;
        padding: 15px 10px;
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>火柴人小遊戲</h1>
      <p>觸碰螢幕讓火柴人跳起，躲開障礙！</p>
    </header>

    <section class="game-frame" aria-label="火柴人遊戲">
      <canvas id="game" aria-label="紅色火柴人遊戲畫面"></canvas>
    </section>
    <p class="hint">觸碰（或點擊）畫面跳躍；遊戲結束後再觸碰即可重新開始</p>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const context = canvas.getContext("2d");
      const world = { width: 900, height: 480 };
      const groundY = world.height - 54;
      const player = {
        x: 160,
        feetY: groundY,
        jumpSpeed: 0,
        grounded: true,
        facing: 1,
        step: 0
      };
      const maxHealth = 3;
      let health = maxHealth;
      let gameOver = false;
      let score = 0;
      let invincibleUntil = 0;
      let obstacles = [];
      let spawnTimer = 1;
      let previousTime = 0;

      function resetGame() {
        health = maxHealth;
        gameOver = false;
        score = 0;
        obstacles = [];
        spawnTimer = 1;
        invincibleUntil = 0;
        player.feetY = groundY;
        player.jumpSpeed = 0;
        player.grounded = true;
      }

      function jump() {
        startMusic();
        if (gameOver) {
          resetGame();
          return;
        }
        if (player.grounded) {
          player.jumpSpeed = -620;
          player.grounded = false;
          playJumpSound();
        }
      }

      function drawObstacles() {
        context.fillStyle = "#6b4f3a";
        for (const o of obstacles) {
          context.fillRect(o.x, groundY - o.h, o.w, o.h);
        }
      }

      function drawHud() {
        context.textAlign = "left";
        context.font = "bold 24px Segoe UI, sans-serif";
        context.fillStyle = "#e43f4f";
        context.fillText("♥".repeat(health) + "♡".repeat(maxHealth - health), 20, 36);
        context.fillStyle = "#33415c";
        context.textAlign = "right";
        context.fillText("分數 " + Math.floor(score), world.width - 20, 36);

        if (gameOver) {
          context.fillStyle = "#000a";
          context.fillRect(0, 0, world.width, world.height);
          context.fillStyle = "#fff";
          context.textAlign = "center";
          context.font = "bold 44px Segoe UI, sans-serif";
          context.fillText("遊戲結束", world.width / 2, world.height / 2 - 10);
          context.font = "22px Segoe UI, sans-serif";
          context.fillText("分數 " + Math.floor(score) + "，觸碰螢幕重新開始", world.width / 2, world.height / 2 + 32);
        }
      }

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        const pixelRatio = window.devicePixelRatio || 1;
        canvas.width = Math.round(bounds.width * pixelRatio);
        canvas.height = Math.round(bounds.width * world.height / world.width * pixelRatio);
        context.setTransform(
          canvas.width / world.width, 0,
          0, canvas.height / world.height, 0, 0
        );
        if (player.grounded) {
          player.feetY = groundY;
        }
      }

      function drawBackground() {
        const sky = context.createLinearGradient(0, 0, 0, world.height);
        sky.addColorStop(0, "#b9e5f2");
        sky.addColorStop(1, "#e4f5e8");
        context.fillStyle = sky;
        context.fillRect(0, 0, world.width, world.height);

        context.fillStyle = "#ffffff55";
        context.beginPath();
        context.arc(735, 92, 39, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = "#9bcfbd";
        context.beginPath();
        context.moveTo(0, groundY - 80);
        context.quadraticCurveTo(220, groundY - 170, 450, groundY - 78);
        context.quadraticCurveTo(680, groundY - 150, world.width, groundY - 75);
        context.lineTo(world.width, groundY);
        context.lineTo(0, groundY);
        context.fill();

        context.fillStyle = "#74b88d";
        context.fillRect(0, groundY, world.width, world.height - groundY);
        context.fillStyle = "#559b72";
        context.fillRect(0, groundY, world.width, 8);
      }

      function drawSegment(startX, startY, endX, endY) {
        context.beginPath();
        context.moveTo(startX, startY);
        context.lineTo(endX, endY);
        context.stroke();
      }

      function drawPlayer(time) {
        const running = !gameOver && player.grounded;
        const phase = Math.sin(player.step);
        const stride = running ? phase * 9 : 0;
        const bob = running ? Math.abs(phase) * 3 : 0;
        const airborne = !player.grounded;
        const feet = player.feetY;

        context.save();
        if (time < invincibleUntil && Math.floor(time / 80) % 2 === 0) {
          context.globalAlpha = 0.35;
        }
        context.translate(player.x, -bob);
        context.scale(player.facing, 1);

        const rect = (color, x, y, w, h) => {
          context.fillStyle = color;
          context.fillRect(x, y, w, h);
        };

        // 鞋子與腿
        const backFootX = airborne ? -16 : -12 - stride;
        const frontFootX = airborne ? 6 : 2 + stride;
        rect("#6b3a1e", backFootX, feet - 8, 16, 8);
        rect("#6b3a1e", frontFootX, feet - 8, 16, 8);
        rect("#2a5fd0", -10, feet - 24, 20, 16);

        // 身體：紅衣藍吊帶褲
        rect("#e43f4f", -13, feet - 44, 26, 22);
        rect("#2a5fd0", -13, feet - 34, 26, 12);
        rect("#2a5fd0", -10, feet - 44, 5, 10);
        rect("#2a5fd0", 5, feet - 44, 5, 10);
        rect("#ffd23f", -9, feet - 31, 4, 4);
        rect("#ffd23f", 5, feet - 31, 4, 4);

        // 手臂與手套
        const armY = airborne ? feet - 56 : feet - 42 + (running ? phase * 4 : 0);
        rect("#e43f4f", 10, armY, 12, 8);
        rect("#ffffff", 20, armY - 1, 8, 10);
        rect("#e43f4f", -22, armY + (airborne ? 0 : 4), 12, 8);
        rect("#ffffff", -28, armY + (airborne ? -1 : 3), 8, 10);

        // 頭、帽子、鬍子
        rect("#f7c59a", -12, feet - 66, 26, 22);
        rect("#e43f4f", -14, feet - 76, 28, 10);
        rect("#e43f4f", -14, feet - 68, 34, 4);
        rect("#ffffff", -2, feet - 75, 10, 8);
        rect("#e43f4f", 1, feet - 74, 4, 5);
        rect("#3a2418", 8, feet - 62, 3, 8);
        rect("#3a2418", 3, feet - 49, 14, 5);
        rect("#3a2418", -14, feet - 66, 5, 14);
        rect("#f7c59a", 12, feet - 56, 6, 6);

        context.restore();
      }

      let audio = null;
      let musicTimer = null;
      let musicStep = 0;
      const melody = [
        523, 0, 659, 784, 659, 0, 523, 0, 587, 0, 698, 880, 698, 0, 587, 0,
        659, 0, 784, 988, 784, 0, 659, 0, 523, 659, 784, 659, 523, 0, 392, 0
      ];
      const bass = [131, 131, 147, 147, 165, 165, 131, 131];

      function tone(freq, start, length, type, volume, endFreq) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        if (endFreq) {
          osc.frequency.exponentialRampToValueAtTime(endFreq, start + length);
        }
        gain.gain.setValueAtTime(volume, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + length);
        osc.connect(gain).connect(audio.destination);
        osc.start(start);
        osc.stop(start + length + 0.02);
      }

      function startMusic() {
        if (!audio) {
          audio = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audio.state === "suspended") {
          audio.resume();
        }
        if (musicTimer) {
          return;
        }
        const beat = 0.16;
        musicTimer = setInterval(() => {
          const now = audio.currentTime + 0.05;
          const note = melody[musicStep % melody.length];
          if (note) {
            tone(note, now, beat * 0.9, "square", 0.05);
          }
          if (musicStep % 4 === 0) {
            tone(bass[(musicStep / 4) % bass.length], now, beat * 3.5, "triangle", 0.12);
          }
          musicStep += 1;
        }, beat * 1000);
      }

      function playJumpSound() {
        if (!audio) {
          return;
        }
        const now = audio.currentTime;
        tone(600, now, 0.09, "sine", 0.18, 1100);
        tone(900, now + 0.09, 0.12, "sine", 0.18, 1500);
      }

      function draw(time) {
        context.clearRect(0, 0, world.width, world.height);
        drawBackground();
        drawObstacles();
        drawPlayer(time);
        drawHud();
      }

      function update(time) {
        const delta = Math.min((time - previousTime) / 1000 || 0, 0.04);
        previousTime = time;

        if (!gameOver) {
          score += delta * 10;
          player.step += delta * 12;
          const speed = 300 + score * 0.8;

          spawnTimer -= delta;
          if (spawnTimer <= 0) {
            obstacles.push({ x: world.width + 20, w: 28 + Math.random() * 18, h: 36 + Math.random() * 30 });
            spawnTimer = 1.1 + Math.random() * 1.1;
          }

          for (const o of obstacles) {
            o.x -= speed * delta;
            const hit = o.x < player.x + 14 && o.x + o.w > player.x - 14 && player.feetY > groundY - o.h;
            if (hit && !o.hit && time >= invincibleUntil) {
              o.hit = true;
              health -= 1;
              invincibleUntil = time + 1000;
              if (health <= 0) {
                gameOver = true;
              }
            }
          }
          obstacles = obstacles.filter((o) => o.x + o.w > -10);
        }

        if (!player.grounded) {
          player.jumpSpeed += 1450 * delta;
          player.feetY += player.jumpSpeed * delta;
          if (player.feetY >= groundY) {
            player.feetY = groundY;
            player.jumpSpeed = 0;
            player.grounded = true;
          }
        }

        draw(time);
        window.requestAnimationFrame(update);
      }

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        jump();
      });

      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
      window.requestAnimationFrame(update);
    })();
  </script>
</body>
</html>
