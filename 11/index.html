<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>火柴人小遊戲</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: #101522;
      color: #f2f4fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #273653 0, transparent 58%),
        #101522;
    }

    main {
      width: min(900px, 100%);
    }

    header {
      margin-bottom: 18px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      letter-spacing: 0.08em;
    }

    header p {
      margin: 0;
      color: #aab5c9;
    }

    .game-frame {
      overflow: hidden;
      border: 1px solid #35415a;
      border-radius: 18px;
      background: #182236;
      box-shadow: 0 24px 70px #0006;
    }

    canvas {
      display: block;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
      height: auto;
      background: #b9e5f2;
    }

    canvas:focus-visible {
      outline: 3px solid #fff;
      outline-offset: -5px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 24px;
      padding: 18px;
      color: #d5dced;
      font-size: 0.95rem;
    }

    .control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    kbd {
      min-width: 34px;
      padding: 5px 9px;
      border: 1px solid #596780;
      border-bottom-width: 3px;
      border-radius: 7px;
      background: #26334a;
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-align: center;
    }

    .hint {
      margin: 14px 0 0;
      color: #8491a8;
      font-size: 0.85rem;
      text-align: center;
    }

    @media (orientation: landscape) and (max-height: 600px) {
      body {
        display: block;
        min-height: 0;
        padding: 0;
        background: #000;
      }

      header, .hint {
        display: none;
      }

      main {
        position: fixed;
        inset: 0;
        width: 100vw;
        display: grid;
        place-items: center;
      }

      .game-frame {
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: #000;
      }

      canvas {
        width: min(100vw, calc(100vh * 1.875));
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .controls {
        gap: 12px 16px;
        padding: 15px 10px;
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>火柴人小遊戲</h1>
      <p>觸碰螢幕讓火柴人跳起，躲開障礙！</p>
    </header>

    <section class="game-frame" aria-label="火柴人遊戲">
      <canvas id="game" aria-label="紅色火柴人遊戲畫面"></canvas>
    </section>
    <p class="hint">觸碰（或點擊）畫面跳躍；遊戲結束後再觸碰即可重新開始</p>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const context = canvas.getContext("2d");
      const world = { width: 900, height: 480 };
      const groundY = world.height - 54;
      const player = {
        x: 160,
        feetY: groundY,
        jumpSpeed: 0,
        grounded: true,
        facing: 1,
        step: 0
      };
      const maxHealth = 3;
      let health = maxHealth;
      let gameOver = false;
      let score = 0;
      let invincibleUntil = 0;
      let obstacles = [];
      let spawnTimer = 1;
      let previousTime = 0;

      function resetGame() {
        health = maxHealth;
        gameOver = false;
        score = 0;
        obstacles = [];
        spawnTimer = 1;
        invincibleUntil = 0;
        player.feetY = groundY;
        player.jumpSpeed = 0;
        player.grounded = true;
      }

      function jump() {
        if (gameOver) {
          resetGame();
          startMusic();
          return;
        }
        startMusic();
        if (player.grounded) {
          player.jumpSpeed = -620;
          player.grounded = false;
          playJumpSound();
        }
      }

      function drawStar(cx, cy, time) {
        const spin = Math.sin(time / 200) * 0.15;
        context.save();
        context.translate(cx, cy + Math.sin(time / 300) * 4);
        context.rotate(spin);
        context.fillStyle = "#ffd23f";
        context.strokeStyle = "#e8a210";
        context.lineWidth = 3;
        context.lineJoin = "round";
        context.beginPath();
        for (let i = 0; i < 10; i++) {
          const radius = i % 2 === 0 ? 17 : 7.5;
          const angle = -Math.PI / 2 + i * Math.PI / 5;
          context.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }
        context.closePath();
        context.fill();
        context.stroke();
        context.restore();
      }

      function drawObstacles(time) {
        for (const o of obstacles) {
          const top = groundY - o.h;
          if (o.wide) {
            context.fillStyle = "#b9763c";
            context.fillRect(o.x, top, o.w, o.h);
            context.fillStyle = "#8f5528";
            for (let bx = o.x + 36; bx < o.x + o.w - 4; bx += 36) {
              context.fillRect(bx, top + 6, 3, o.h - 6);
            }
            context.fillRect(o.x, top + o.h / 2, o.w, 3);
            context.fillStyle = "#6cc36a";
            context.fillRect(o.x - 2, top - 5, o.w + 4, 9);
            if (!o.starTaken) {
              drawStar(o.x + o.w + starOffset, top - starHeight, time);
            }
          } else {
            context.fillStyle = "#6b4f3a";
            context.fillRect(o.x, top, o.w, o.h);
          }
        }
      }

      function drawHud() {
        context.textAlign = "left";
        context.font = "bold 24px Segoe UI, sans-serif";
        context.fillStyle = "#e43f4f";
        context.fillText("♥".repeat(health) + "♡".repeat(maxHealth - health), 20, 36);
        context.fillStyle = "#33415c";
        context.textAlign = "right";
        context.fillText("分數 " + Math.floor(score), world.width - 20, 36);

        if (gameOver) {
          context.fillStyle = "#000a";
          context.fillRect(0, 0, world.width, world.height);
          context.fillStyle = "#fff";
          context.textAlign = "center";
          context.font = "bold 44px Segoe UI, sans-serif";
          context.fillText("遊戲結束", world.width / 2, world.height / 2 - 10);
          context.font = "22px Segoe UI, sans-serif";
          context.fillText("分數 " + Math.floor(score) + "，觸碰螢幕重新開始", world.width / 2, world.height / 2 + 32);
        }
      }

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        const pixelRatio = window.devicePixelRatio || 1;
        canvas.width = Math.round(bounds.width * pixelRatio);
        canvas.height = Math.round(bounds.width * world.height / world.width * pixelRatio);
        context.setTransform(
          canvas.width / world.width, 0,
          0, canvas.height / world.height, 0, 0
        );
        if (player.grounded) {
          player.feetY = groundY;
        }
      }

      function drawBackground() {
        const sky = context.createLinearGradient(0, 0, 0, world.height);
        sky.addColorStop(0, "#b9e5f2");
        sky.addColorStop(1, "#e4f5e8");
        context.fillStyle = sky;
        context.fillRect(0, 0, world.width, world.height);

        context.fillStyle = "#ffffff55";
        context.beginPath();
        context.arc(735, 92, 39, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = "#9bcfbd";
        context.beginPath();
        context.moveTo(0, groundY - 80);
        context.quadraticCurveTo(220, groundY - 170, 450, groundY - 78);
        context.quadraticCurveTo(680, groundY - 150, world.width, groundY - 75);
        context.lineTo(world.width, groundY);
        context.lineTo(0, groundY);
        context.fill();

        context.fillStyle = "#74b88d";
        context.fillRect(0, groundY, world.width, world.height - groundY);
        context.fillStyle = "#559b72";
        context.fillRect(0, groundY, world.width, 8);
      }

      function drawSegment(startX, startY, endX, endY) {
        context.beginPath();
        context.moveTo(startX, startY);
        context.lineTo(endX, endY);
        context.stroke();
      }

      function drawPlayer(time) {
        const running = !gameOver && player.grounded;
        const phase = running ? Math.sin(player.step) : 0;
        const bob = running ? Math.abs(phase) * 3 : 0;
        const airborne = !player.grounded;
        const feet = player.feetY;
        const hipY = feet - 30;
        const shoulderY = feet - 52;
        const headX = 3;
        const headY = feet - 68;

        const limb = (x1, y1, x2, y2, width, color) => {
          context.strokeStyle = color;
          context.lineWidth = width;
          context.beginPath();
          context.moveTo(x1, y1);
          context.lineTo(x2, y2);
          context.stroke();
        };
        const ellipse = (x, y, rx, ry, color, rotation = 0) => {
          context.fillStyle = color;
          context.beginPath();
          context.ellipse(x, y, rx, ry, rotation, 0, Math.PI * 2);
          context.fill();
        };
        const shoe = (x, y) => ellipse(x + 3, y, 10, 6, "#7a4320");
        const glove = (x, y) => {
          ellipse(x, y, 6.5, 6, "#ffffff");
          ellipse(x + 1, y + 1, 5, 4.5, "#e9edf5");
        };

        context.save();
        if (time < invincibleUntil && Math.floor(time / 80) % 2 === 0) {
          context.globalAlpha = 0.35;
        }
        context.translate(player.x, -bob);
        context.scale(player.facing, 1);
        context.lineCap = "round";
        context.lineJoin = "round";

        const lean = airborne ? 0.12 : 0.22;
        const hipX = -1;
        const leg = (s) => {
          const thigh = 0.65 * s;
          const bend = s > 0 ? 0.15 : 0.15 + 0.9 * -s;
          const kneeX = hipX + Math.sin(thigh) * 15;
          const kneeY = hipY + Math.cos(thigh) * 15;
          const shin = thigh - bend;
          return {
            kneeX, kneeY,
            footX: kneeX + Math.sin(shin) * 15,
            footY: kneeY + Math.cos(shin) * 15
          };
        };
        const arm = (t) => {
          const upper = 0.9 * t;
          const fore = upper + Math.max(-1, Math.min(1, t * 4)) * 1.9;
          const elbowX = Math.sin(upper) * 13;
          const elbowY = Math.cos(upper) * 13;
          return {
            elbowX, elbowY,
            handX: elbowX + Math.sin(fore) * 12,
            handY: elbowY + Math.cos(fore) * 12
          };
        };
        const withLean = (draw) => {
          context.save();
          context.translate(0, hipY);
          context.rotate(lean);
          context.translate(0, -hipY);
          draw();
          context.restore();
        };
        const drawLeg = (pose, color) => {
          limb(hipX, hipY, pose.kneeX, pose.kneeY, 12, color);
          limb(pose.kneeX, pose.kneeY, pose.footX, pose.footY - 3, 11, color);
          shoe(pose.footX, pose.footY);
        };
        const drawArm = (pose, color) => {
          const sx = 2;
          const sy = shoulderY + 4;
          limb(sx, sy, sx + pose.elbowX, sy + pose.elbowY, 9, color);
          limb(sx + pose.elbowX, sy + pose.elbowY, sx + pose.handX, sy + pose.handY, 8, color);
          glove(sx + pose.handX, sy + pose.handY);
        };

        const sPhase = airborne ? 0.9 : phase;
        const frontLeg = leg(sPhase);
        const backLeg = leg(-sPhase);
        const frontArm = arm(airborne ? 0.9 : -phase);
        const backArm = arm(airborne ? -0.9 : phase);

        drawLeg(backLeg, "#1f4fbf");
        withLean(() => {
          drawArm(backArm, "#c81e28");

        // 身體：紅色上衣、藍色吊帶褲、金色鈕扣
        ellipse(0, shoulderY + 10, 15, 14, "#e0262e");
        ellipse(0, hipY - 4, 15, 15, "#2a5fd0");
        ellipse(-3, hipY - 8, 8, 9, "#3b72e6");
        context.fillStyle = "#2a5fd0";
        context.beginPath();
        context.moveTo(-10, shoulderY + 2);
        context.lineTo(-4, shoulderY + 2);
        context.lineTo(-1, hipY - 10);
        context.lineTo(-13, hipY - 10);
        context.closePath();
        context.fill();
        context.beginPath();
        context.moveTo(4, shoulderY + 2);
        context.lineTo(10, shoulderY + 2);
        context.lineTo(13, hipY - 10);
        context.lineTo(1, hipY - 10);
        context.closePath();
        context.fill();
        ellipse(-7, shoulderY + 17, 3.2, 3.2, "#ffd23f");
        ellipse(8, shoulderY + 17, 3.2, 3.2, "#ffd23f");
        });

        drawLeg(frontLeg, "#2a5fd0");

        withLean(() => {
        drawArm(frontArm, "#e0262e");

        // 頭部：耳朵、頭髮、臉
        ellipse(headX - 11, headY + 3, 4.5, 6, "#f4b98c");
        ellipse(headX - 10, headY + 6, 8, 9, "#5a3320");
        ellipse(headX, headY + 2, 15, 14, "#f8c9a0");

        // 眼睛
        ellipse(headX + 6, headY - 1, 4, 5.5, "#ffffff");
        ellipse(headX + 7.5, headY, 2.4, 3.2, "#2f7fe0");
        ellipse(headX + 7.8, headY, 1.1, 1.6, "#10203a");
        limb(headX + 2, headY - 8, headX + 10, headY - 6, 2.2, "#3a2418");

        // 大鼻子與鬍子
        ellipse(headX + 14, headY + 5, 6.5, 5.5, "#f2a981");
        ellipse(headX + 9, headY + 11, 8, 3.6, "#3a2418", -0.15);
        ellipse(headX + 1, headY + 10, 5.5, 3.4, "#3a2418", 0.35);
        limb(headX + 6, headY + 14, headX + 11, headY + 14, 1.8, "#b5503c");

        // 帽子與 M 標誌
        context.fillStyle = "#e0262e";
        context.beginPath();
        context.arc(headX, headY - 6, 15, Math.PI * 1.02, Math.PI * 2.02);
        context.lineTo(headX + 14, headY - 6);
        context.quadraticCurveTo(headX + 24, headY - 8, headX + 25, headY - 3);
        context.quadraticCurveTo(headX + 14, headY - 1, headX - 6, headY - 3);
        context.closePath();
        context.fill();
        ellipse(headX + 18, headY - 5, 8, 2.6, "#b81c24", 0.15);
        ellipse(headX + 3, headY - 15, 5.5, 5.5, "#ffffff");
        context.fillStyle = "#e0262e";
        context.font = "bold 8px Segoe UI, sans-serif";
        context.textAlign = "center";
        context.fillText("M", headX + 3, headY - 12.2);
        });

        context.restore();
      }

      let audio = null;
      let musicTimer = null;
      let musicStep = 0;
      const midiToFreq = (note) => 440 * Math.pow(2, (note - 69) / 12);
      // 每段 16 個十六分音符；0 代表休止
      const sections = {
        A: {
          lead: [72, 76, 79, 76, 72, 76, 79, 84, 83, 79, 76, 79, 83, 79, 76, 72],
          bass: [48, 48, 43, 43]
        },
        B: {
          lead: [77, 81, 84, 81, 77, 81, 84, 81, 79, 83, 86, 83, 79, 83, 86, 79],
          bass: [41, 41, 43, 43]
        },
        C: {
          lead: [76, 0, 81, 0, 84, 81, 76, 0, 74, 0, 79, 0, 83, 79, 74, 0],
          bass: [45, 45, 40, 40]
        },
        D: {
          lead: [84, 83, 81, 79, 77, 79, 81, 83, 84, 0, 79, 0, 72, 76, 79, 84],
          bass: [41, 43, 48, 48]
        }
      };
      const songOrder = ["A", "A", "B", "A", "C", "B", "D", "A"];

      function tone(freq, start, length, type, volume, endFreq) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        if (endFreq) {
          osc.frequency.exponentialRampToValueAtTime(endFreq, start + length);
        }
        gain.gain.setValueAtTime(volume, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + length);
        osc.connect(gain).connect(audio.destination);
        osc.start(start);
        osc.stop(start + length + 0.02);
      }

      function startMusic() {
        if (!audio) {
          audio = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audio.state === "suspended") {
          audio.resume();
        }
        if (musicTimer) {
          return;
        }
        musicStep = 0;
        const beat = 0.125;
        musicTimer = setInterval(() => {
          const now = audio.currentTime + 0.05;
          const bar = Math.floor(musicStep / 16) % songOrder.length;
          const section = sections[songOrder[bar]];
          const step = musicStep % 16;
          const note = section.lead[step];
          if (note) {
            tone(midiToFreq(note), now, beat * 0.85, bar % 2 ? "triangle" : "square", bar % 2 ? 0.05 : 0.02);
          }
          if (step % 4 === 0) {
            tone(midiToFreq(section.bass[step / 4]), now, beat * 1.8, "triangle", 0.05);
            tone(120, now, 0.1, "sine", 0.05, 45);
          } else if (step % 4 === 2) {
            tone(midiToFreq(section.bass[Math.floor(step / 4)] + 12), now, beat * 0.6, "triangle", 0.025);
          }
          musicStep += 1;
        }, beat * 1000);
      }

      function stopMusic() {
        clearInterval(musicTimer);
        musicTimer = null;
      }

      function playJumpSound() {
        if (!audio) {
          return;
        }
        const now = audio.currentTime;
        tone(600, now, 0.09, "sine", 0.1, 1100);
        tone(900, now + 0.09, 0.12, "sine", 0.1, 1500);
      }

      function playHealSound() {
        if (!audio) {
          return;
        }
        const now = audio.currentTime;
        [659, 784, 988, 1319].forEach((freq, index) => {
          tone(freq, now + index * 0.07, 0.14, "sine", 0.1);
        });
      }

      function playHitSound() {
        if (!audio) {
          return;
        }
        const now = audio.currentTime;
        tone(260, now, 0.22, "sawtooth", 0.07, 70);
        tone(110, now, 0.18, "square", 0.06, 50);
      }

      function playFailSound() {
        if (!audio) {
          return;
        }
        const now = audio.currentTime + 0.05;
        [392, 349, 330, 262].forEach((freq, index) => {
          tone(freq, now + index * 0.22, 0.28, "triangle", 0.12);
        });
        tone(196, now + 0.88, 0.9, "sawtooth", 0.08, 60);
      }

      function draw(time) {
        context.clearRect(0, 0, world.width, world.height);
        drawBackground();
        drawObstacles(time);
        drawPlayer(time);
        drawHud();
      }

      const starHeight = 175;
      const starOffset = 70;

      function platformLevel(prevFeet) {
        let level = groundY;
        for (const o of obstacles) {
          const top = groundY - o.h;
          if (o.wide && o.x < player.x + 10 && o.x + o.w > player.x - 10 && prevFeet <= top + 2) {
            level = Math.min(level, top);
          }
        }
        return level;
      }

      function stepPlayer(delta) {
        const level = platformLevel(player.feetY);
        if (player.grounded) {
          if (level > player.feetY + 0.5) {
            player.grounded = false;
            player.jumpSpeed = 0;
          } else {
            player.feetY = level;
          }
        }
        if (!player.grounded) {
          player.jumpSpeed += 1450 * delta;
          player.feetY += player.jumpSpeed * delta;
          if (player.jumpSpeed >= 0 && player.feetY >= level) {
            player.feetY = level;
            player.jumpSpeed = 0;
            player.grounded = true;
          }
        }
      }

      function update(time) {
        const delta = Math.min((time - previousTime) / 1000 || 0, 0.04);
        previousTime = time;

        if (!gameOver) {
          score += delta * 10;
          player.step += delta * 12;
          const speed = 300 + score * 0.8;

          spawnTimer -= delta;
          if (spawnTimer <= 0) {
            if (Math.random() < 0.35) {
              obstacles.push({ x: world.width + 20, w: 130 + Math.random() * 40, h: 55 + Math.random() * 10, wide: true, starTaken: false });
              spawnTimer = 1.6 + Math.random() * 1.0;
            } else {
              obstacles.push({ x: world.width + 20, w: 28 + Math.random() * 18, h: 36 + Math.random() * 30 });
              spawnTimer = 1.1 + Math.random() * 1.1;
            }
          }

          for (const o of obstacles) {
            o.x -= speed * delta;
          }
          stepPlayer(delta);

          for (const o of obstacles) {
            const top = groundY - o.h;
            const hit = o.x < player.x + 14 && o.x + o.w > player.x - 14 && player.feetY > top + 2;
            if (hit && !o.hit && time >= invincibleUntil) {
              o.hit = true;
              health -= 1;
              invincibleUntil = time + 1000;
              if (health <= 0) {
                gameOver = true;
                stopMusic();
                playFailSound();
              } else {
                playHitSound();
              }
            }

            if (o.wide && !o.starTaken) {
              const starX = o.x + o.w + starOffset;
              const starY = top - starHeight;
              if (Math.abs(starX - player.x) < 36 && starY > player.feetY - 100 && starY < player.feetY - 15) {
                o.starTaken = true;
                health = Math.min(maxHealth, health + 1);
                playHealSound();
              }
            }
          }
          obstacles = obstacles.filter((o) => o.x + o.w > -10);
        } else if (!player.grounded) {
          stepPlayer(delta);
        }

        draw(time);
        window.requestAnimationFrame(update);
      }

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        const landscape = window.matchMedia("(orientation: landscape) and (max-height: 600px)").matches;
        if (landscape && !document.fullscreenElement && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
        jump();
      });

      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
      window.requestAnimationFrame(update);
    })();
  </script>
</body>
</html>
