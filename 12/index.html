<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>網頁瀏覽計數器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      background: #eef2f7;
      color: #233046;
    }
    .card {
      width: min(100%, 440px);
      padding: 36px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(35, 48, 70, .12);
      text-align: center;
    }
    h1 { margin: 0; font-size: 1.4rem; }
    .count {
      margin: 20px 0;
      color: #1565c0;
      font-size: 3rem;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    .hint { margin: 0; color: #5b687a; line-height: 1.6; }
    details { margin-top: 24px; text-align: left; color: #5b687a; line-height: 1.6; }
    summary { cursor: pointer; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>網頁瀏覽次數</h1>
    <p class="count" id="count" role="status" aria-live="polite">讀取中…</p>
    <p class="hint">每次開啟或重新整理頁面，瀏覽次數就會增加一次。</p>
    <details>
      <summary>部署與設定說明</summary>
      <ol>
        <li>建立 Google Apps Script 專案，將 count.gs 的內容貼入指令碼編輯器並儲存。</li>
        <li>選擇「部署」→「新增部署」→「網頁應用程式」，執行身分選擇「我」，存取權選擇「所有人」，然後授權並部署。</li>
        <li>複製部署後以 <code>/exec</code> 結尾的網址，填入本頁原始碼中的 <code>COUNTER_ENDPOINT</code>，再儲存並重新載入頁面。</li>
        <li>修改後端程式後，請透過「管理部署」更新部署版本。計數值儲存在該 Apps Script 專案的指令碼屬性中。</li>
      </ol>
    </details>
  </main>
  <script>
    // 將此處替換為自己的 Google Apps Script 網頁應用程式 /exec 網址。
    const COUNTER_ENDPOINT = '';

    function updateCounter() {
      const countElement = document.getElementById('count');
      if (!COUNTER_ENDPOINT) {
        countElement.textContent = '尚未設定';
        return;
      }

      let url;
      try {
        url = new URL(COUNTER_ENDPOINT);
      } catch (error) {
        countElement.textContent = '網址設定錯誤';
        console.error('計數器網址無效：', error);
        return;
      }
      if (url.protocol !== 'https:' || url.hostname !== 'script.google.com') {
        countElement.textContent = '網址設定錯誤';
        console.error('計數器網址必須是 Google Apps Script 的 HTTPS 網址。');
        return;
      }

      const callbackName = 'counterCallback_' + Date.now() + '_' +
        Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const timeout = setTimeout(() => {
        countElement.textContent = '連線逾時';
        cleanup();
      }, 15000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
      }

      window[callbackName] = data => {
        if (data && Number.isSafeInteger(data.count) && data.count > 0) {
          countElement.textContent = data.count.toLocaleString('zh-TW');
        } else {
          countElement.textContent = '讀取失敗';
        }
        cleanup();
      };
      script.onerror = () => {
        countElement.textContent = '讀取失敗';
        cleanup();
      };
      url.searchParams.set('callback', callbackName);
      script.src = url.toString();
      document.head.appendChild(script);
    }

    updateCounter();
  </script>
</body>
</html>
